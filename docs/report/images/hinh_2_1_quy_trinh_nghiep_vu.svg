<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1550 340" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#78909c" />
    </marker>
  </defs>

  <!-- Step 1 -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <rect width="320" height="260" rx="10" fill="#f0f8ff" stroke="#0288d1" stroke-width="2"/>
    <path d="M 0 10 Q 0 0 10 0 L 310 0 Q 320 0 320 10 L 320 60 L 0 60 Z" fill="#0288d1"/>
    <text x="20" y="28" font-size="18" font-weight="bold" fill="#ffffff">01. ĐĂNG KÝ ONLINE</text>
    <text x="20" y="48" font-size="13" fill="#e1f5fe">Cổng tiếp nhận công khai</text>
    <text x="20" y="105" font-size="15" fill="#333333">• Tra cứu phòng theo giới tính</text>
    <text x="20" y="145" font-size="15" fill="#333333">• Chọn phòng tầng thấp trước</text>
    <text x="20" y="185" font-size="15" fill="#333333">• Nộp đơn không cần tài khoản</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="370" y1="160" x2="415" y2="160" stroke="#78909c" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g transform="translate(425, 30)" filter="url(#shadow)">
    <rect width="320" height="260" rx="10" fill="#fff8e1" stroke="#f57c00" stroke-width="2"/>
    <path d="M 0 10 Q 0 0 10 0 L 310 0 Q 320 0 320 10 L 320 60 L 0 60 Z" fill="#f57c00"/>
    <text x="20" y="28" font-size="18" font-weight="bold" fill="#ffffff">02. DUYỆT &amp; KHÓA PHÒNG</text>
    <text x="20" y="48" font-size="13" fill="#fff3e0">Cán bộ KTX thẩm định</text>
    <text x="20" y="105" font-size="15" fill="#333333">• Khóa giường nguyên tử</text>
    <text x="20" y="145" font-size="15" fill="#333333">• Tự cấp tài khoản qua Email</text>
    <text x="20" y="185" font-size="15" fill="#333333">• Tự sinh hóa đơn cọc &amp; phòng</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="755" y1="160" x2="800" y2="160" stroke="#78909c" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g transform="translate(810, 30)" filter="url(#shadow)">
    <rect width="320" height="260" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
    <path d="M 0 10 Q 0 0 10 0 L 310 0 Q 320 0 320 10 L 320 60 L 0 60 Z" fill="#388e3c"/>
    <text x="20" y="28" font-size="18" font-weight="bold" fill="#ffffff">03. LƯU TRÚ &amp; THU PHÍ</text>
    <text x="20" y="48" font-size="13" fill="#e8f5e9">Vận hành định kỳ hàng tháng</text>
    <text x="20" y="105" font-size="15" fill="#333333">• Đổi mật khẩu lần đầu</text>
    <text x="20" y="145" font-size="15" fill="#333333">• Chốt 01 HĐ điện nước / phòng</text>
    <text x="20" y="185" font-size="15" fill="#333333">• Quét mã VietQR / Tiền mặt</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="1140" y1="160" x2="1185" y2="160" stroke="#78909c" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <g transform="translate(1195, 30)" filter="url(#shadow)">
    <rect width="320" height="260" rx="10" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
    <path d="M 0 10 Q 0 0 10 0 L 310 0 Q 320 0 320 10 L 320 60 L 0 60 Z" fill="#c2185b"/>
    <text x="20" y="28" font-size="18" font-weight="bold" fill="#ffffff">04. TRẢ PHÒNG &amp; THANH LÝ</text>
    <text x="20" y="48" font-size="13" fill="#fce4ec">Kết thúc hợp đồng lưu trú</text>
    <text x="20" y="105" font-size="15" fill="#333333">• Kiểm tra sạch nợ cá nhân &amp; phòng</text>
    <text x="20" y="145" font-size="15" fill="#333333">• Kiểm kê tài sản, thu chìa</text>
    <text x="20" y="185" font-size="15" fill="#333333">• Giải phóng giường về Trống</text>
  </g>
</svg>
